<text x="590.0" y="36" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">ArithmeticClaimKit</text>
<text x="590.0" y="60" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">does&#160;the&#160;arithmetic&#160;an&#160;answer&#160;states&#160;on&#160;its&#160;own&#160;hold,&#160;once&#160;it&#160;is&#160;done&#160;exactly?</text>
<rect x="30" y="90" width="220" height="100" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
<text x="140.0" y="114" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">ProviderGatewayKit</text>
<text x="140.0" y="136" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">sends&#160;the&#160;turn</text>
<text x="140.0" y="154" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">the&#160;answer&#160;comes&#160;back</text>
<rect x="290" y="90" width="300" height="190" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="440.0" y="114" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">ArithmeticReader</text>
<text x="440.0" y="136" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Lexer:&#160;numbers&#160;as&#160;written&#160;($,&#160;%,&#160;k,&#160;million,</text>
<text x="440.0" y="154" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">lakh,&#160;units),&#160;symbols,&#160;words,&#160;LaTeX;</text>
<text x="440.0" y="172" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">fenced&#160;code,&#160;list&#160;markers,&#160;algebra&#160;skipped</text>
<text x="440.0" y="190" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">ChainReader:&#160;=&#160;&#8776;&#160;is&#160;equals,&#160;&quot;,&#160;which&#160;is&quot;,</text>
<text x="440.0" y="208" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">rewrites&#160;and&#160;run-on&#160;chains,&#160;12&#160;is&#160;15%&#160;of&#160;80</text>
<text x="440.0" y="226" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">ChangeReader:&#160;from&#160;A&#160;to&#160;B,&#160;a&#160;P%&#160;increase,</text>
<text x="440.0" y="244" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">points&#160;vs&#160;percent,&#160;direction&#160;words</text>
<rect x="630" y="90" width="280" height="190" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="770.0" y="114" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">ArithmeticEvaluator</text>
<text x="770.0" y="136" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">recomputes&#160;in&#160;Decimal,&#160;exactly</text>
<text x="770.0" y="154" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">quantum:&#160;one&#160;step&#160;of&#160;the&#160;last&#160;written&#160;digit</text>
<text x="770.0" y="172" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">rounded&#160;half&#160;up&#160;or&#160;half&#160;to&#160;even:&#160;holds</text>
<text x="770.0" y="190" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">cut&#160;short&#160;with&#160;...:&#160;holds</text>
<text x="770.0" y="208" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">&#8776;&#160;/&#160;about:&#160;within&#160;the&#160;policy&#160;tolerance</text>
<text x="770.0" y="226" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">one&#160;step&#160;off:&#160;misrounded</text>
<text x="770.0" y="244" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">change:&#160;magnitude,&#160;direction,&#160;points</text>
