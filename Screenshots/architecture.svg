<text x="1050.0" y="136" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">verdict:&#160;noArithmetic,</text>
<text x="1050.0" y="154" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">verified,&#160;caution,&#160;wrong</text>
<text x="1050.0" y="172" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">corrections&#160;with&#160;the</text>
<text x="1050.0" y="190" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">right&#160;value</text>
<text x="1050.0" y="208" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">note&#160;for&#160;the&#160;reader</text>
<text x="1050.0" y="226" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">feedback&#160;for&#160;the&#160;model</text>
<text x="1050.0" y="244" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">summary&#160;for&#160;a&#160;trace</text>
<rect x="630" y="320" width="280" height="110" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
<text x="770.0" y="344" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">ArithmeticLedger&#160;(actor)</text>
<text x="770.0" y="366" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">one&#160;per&#160;conversation</text>
<text x="770.0" y="384" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">the&#160;same&#160;wrong&#160;result&#160;stated&#160;again</text>
<text x="770.0" y="402" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">after&#160;a&#160;correction:&#160;marked&#160;repeated</text>
<text x="770.0" y="420" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">reviews,&#160;results,&#160;flagged,&#160;repeated</text>
<rect x="290" y="320" width="300" height="110" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
<text x="440.0" y="344" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">ArithmeticPolicy</text>
<text x="440.0" y="366" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">.standard:&#160;&#8776;&#160;within&#160;1%,&#160;misrounding&#160;flagged</text>
<text x="440.0" y="384" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">.lenient:&#160;&#8776;&#160;within&#160;5%,&#160;misrounding&#160;passes</text>
<text x="440.0" y="402" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">.strict:&#160;&#8776;&#160;must&#160;still&#160;round&#160;as&#160;written</text>
<text x="440.0" y="420" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">readsPercentChanges</text>
