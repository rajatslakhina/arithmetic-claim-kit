<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1561" viewBox="0 0 1240 1561">
<rect width="1240" height="1561" rx="10" fill="#0f172a"/>
<circle cx="22" cy="20" r="6" fill="#ef4444"/><circle cx="42" cy="20" r="6" fill="#f59e0b"/><circle cx="62" cy="20" r="6" fill="#22c55e"/>
<text x="620" y="25" fill="#94a3b8" font-family="Menlo, monospace" font-size="13" text-anchor="middle">$&#160;swift&#160;run&#160;ArithmeticClaimDemo&#160;&#160;&#160;(complete&#160;output)</text>
<text x="20" y="56" fill="#e2e8f0" font-family="Menlo, monospace" font-size="12">ArithmeticClaimKit&#160;demo:&#160;stated&#160;arithmetic,&#160;recomputed&#160;exactly</text>
<text x="20" y="75" fill="#e2e8f0" font-family="Menlo, monospace" font-size="12"></text>
<text x="20" y="94" fill="#7dd3fc" font-family="Menlo, monospace" font-size="12">[1]&#160;A&#160;tip,&#160;and&#160;the&#160;total&#160;that&#160;depends&#160;on&#160;it</text>
<text x="20" y="113" fill="#e2e8f0" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;asked:&#160;&quot;Dinner&#160;was&#160;$80.&#160;What&#160;is&#160;a&#160;15%&#160;tip,&#160;and&#160;what&#160;do&#160;I&#160;pay&#160;in&#160;all?&quot;</text>
<text x="20" y="132" fill="#e2e8f0" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;answer:&#160;&quot;A&#160;15%&#160;tip&#160;is&#160;15%&#160;of&#160;$80,&#160;which&#160;is&#160;$14.&#160;So&#160;you&#160;pay&#160;$80&#160;+&#160;$14&#160;=&#160;$94.&quot;</text>
<text x="20" y="151" fill="#f87171" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;XX&#160;15%&#160;of&#160;$80,&#160;which&#160;is&#160;$14&#160;&#160;-&gt;&#160;&#160;wrong</text>
<text x="20" y="170" fill="#86efac" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;ok&#160;$80&#160;+&#160;$14&#160;=&#160;$94&#160;&#160;-&gt;&#160;&#160;exact</text>
<text x="20" y="189" fill="#c4b5fd" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;verdict:&#160;wrong&#160;(2&#160;results&#160;checked,&#160;1&#160;hold,&#160;1&#160;wrong)</text>
<text x="20" y="208" fill="#e2e8f0" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;($94&#160;is&#160;right&#160;for&#160;$80&#160;+&#160;$14,&#160;and&#160;wrong&#160;as&#160;the&#160;bill:&#160;the&#160;feedback&#160;asks&#160;for&#160;dependent&#160;figures&#160;too.)</text>
<text x="20" y="227" fill="#fde68a" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;feedback&#160;to&#160;the&#160;model:</text>
<text x="20" y="246" fill="#e2e8f0" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;&#160;&#160;Some&#160;arithmetic&#160;in&#160;your&#160;answer&#160;does&#160;not&#160;hold:</text>
<text x="20" y="265" fill="#e2e8f0" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;&#160;&#160;-&#160;15%&#160;of&#160;$80&#160;is&#160;$12,&#160;not&#160;$14.</text>
<text x="20" y="284" fill="#e2e8f0" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;&#160;&#160;Recompute&#160;each&#160;of&#160;these,&#160;correct&#160;every&#160;figure&#160;that&#160;depends&#160;on&#160;them,&#160;and&#160;keep&#160;the&#160;rest&#160;of&#160;the&#160;answer&#160;as&#160;it&#160;is.</text>
<text x="20" y="303" fill="#e2e8f0" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;rewrite:&#160;&quot;A&#160;15%&#160;tip&#160;is&#160;15%&#160;of&#160;$80,&#160;which&#160;is&#160;$12.&#160;So&#160;you&#160;pay&#160;$80&#160;+&#160;$12&#160;=&#160;$92.&quot;</text>
<text x="20" y="322" fill="#86efac" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;ok&#160;15%&#160;of&#160;$80,&#160;which&#160;is&#160;$12&#160;&#160;-&gt;&#160;&#160;exact</text>
<text x="20" y="341" fill="#86efac" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;ok&#160;$80&#160;+&#160;$12&#160;=&#160;$92&#160;&#160;-&gt;&#160;&#160;exact</text>
<text x="20" y="360" fill="#c4b5fd" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;verdict:&#160;verified&#160;(2&#160;results&#160;checked,&#160;2&#160;hold)</text>
<text x="20" y="379" fill="#e2e8f0" font-family="Menlo, monospace" font-size="12"></text>
<text x="20" y="398" fill="#7dd3fc" font-family="Menlo, monospace" font-size="12">[2]&#160;A&#160;run-on&#160;chain</text>
<text x="20" y="417" fill="#e2e8f0" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;answer:&#160;&quot;Three&#160;dozen&#160;eggs&#160;and&#160;five&#160;more:&#160;3&#160;&#215;&#160;12&#160;=&#160;36&#160;+&#160;5&#160;=&#160;42&#160;eggs.&quot;</text>
<text x="20" y="436" fill="#86efac" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;ok&#160;3&#160;&#215;&#160;12&#160;=&#160;36&#160;&#160;-&gt;&#160;&#160;exact</text>
<text x="20" y="455" fill="#f87171" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;XX&#160;36&#160;+&#160;5&#160;=&#160;42&#160;&#160;-&gt;&#160;&#160;wrong</text>
<text x="20" y="474" fill="#c4b5fd" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;verdict:&#160;wrong&#160;(2&#160;results&#160;checked,&#160;1&#160;hold,&#160;1&#160;wrong)</text>
<text x="20" y="493" fill="#fde68a" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;Arithmetic&#160;check:&#160;36&#160;+&#160;5&#160;is&#160;41,&#160;not&#160;42.</text>
<text x="20" y="512" fill="#e2e8f0" font-family="Menlo, monospace" font-size="12"></text>
<text x="20" y="531" fill="#7dd3fc" font-family="Menlo, monospace" font-size="12">[3]&#160;Percentage&#160;changes</text>
<text x="20" y="550" fill="#e2e8f0" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;answer:&#160;&quot;Revenue&#160;went&#160;from&#160;$40k&#160;to&#160;$50k,&#160;a&#160;20%&#160;increase.&#160;Churn&#160;fell&#160;from&#160;5%&#160;to&#160;4%,&#160;a&#160;1%&#160;decrease.&#160;Signups&#160;dropped&#160;from&#160;200&#160;to&#160;250,&#160;a&#160;25%&#160;decrease.&quot;</text>
<text x="20" y="569" fill="#f87171" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;XX&#160;from&#160;$40k&#160;to&#160;$50k,&#160;a&#160;20%&#160;increase&#160;&#160;-&gt;&#160;&#160;wrong</text>
<text x="20" y="588" fill="#fbbf24" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;??&#160;from&#160;5%&#160;to&#160;4%,&#160;a&#160;1%&#160;decrease&#160;&#160;-&gt;&#160;&#160;points&#160;written&#160;as&#160;a&#160;percent</text>
<text x="20" y="607" fill="#f87171" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;XX&#160;from&#160;200&#160;to&#160;250,&#160;a&#160;25%&#160;decrease&#160;&#160;-&gt;&#160;&#160;wrong&#160;direction</text>
<text x="20" y="626" fill="#c4b5fd" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;verdict:&#160;wrong&#160;(3&#160;results&#160;checked,&#160;0&#160;hold,&#160;1&#160;to&#160;check,&#160;2&#160;wrong)</text>
<text x="20" y="645" fill="#fde68a" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;-&#160;from&#160;$40k&#160;to&#160;$50k&#160;is&#160;a&#160;25%&#160;increase,&#160;not&#160;a&#160;20%&#160;increase.</text>
<text x="20" y="664" fill="#fde68a" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;-&#160;from&#160;5%&#160;to&#160;4%&#160;is&#160;1&#160;percentage&#160;point&#160;but&#160;a&#160;20%&#160;decrease;&#160;&quot;a&#160;1%&#160;decrease&quot;&#160;reads&#160;the&#160;points&#160;as&#160;a&#160;percent.</text>
<text x="20" y="683" fill="#fde68a" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;-&#160;from&#160;200&#160;to&#160;250&#160;is&#160;a&#160;25%&#160;increase,&#160;not&#160;a&#160;25%&#160;decrease.</text>
<text x="20" y="702" fill="#e2e8f0" font-family="Menlo, monospace" font-size="12"></text>
<text x="20" y="721" fill="#7dd3fc" font-family="Menlo, monospace" font-size="12">[4]&#160;Rounding</text>
<text x="20" y="740" fill="#e2e8f0" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;answer:&#160;&quot;Split&#160;three&#160;ways,&#160;$100&#160;/&#160;3&#160;=&#160;$33.34&#160;each.&#160;Two&#160;thirds&#160;is&#160;2/3&#160;&#8776;&#160;0.67,&#160;and&#160;22&#160;/&#160;7&#160;=&#160;3.14&#8230;&#160;is&#160;close&#160;to&#160;pi.&quot;</text>
<text x="20" y="759" fill="#fbbf24" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;??&#160;$100&#160;/&#160;3&#160;=&#160;$33.34&#160;&#160;-&gt;&#160;&#160;misrounded</text>
<text x="20" y="778" fill="#86efac" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;ok&#160;2/3&#160;&#8776;&#160;0.67&#160;&#160;-&gt;&#160;&#160;rounded&#160;as&#160;written</text>
<text x="20" y="797" fill="#86efac" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;ok&#160;22&#160;/&#160;7&#160;=&#160;3.14&#8230;&#160;&#160;-&gt;&#160;&#160;rounded&#160;as&#160;written</text>
<text x="20" y="816" fill="#c4b5fd" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;verdict:&#160;caution&#160;(3&#160;results&#160;checked,&#160;2&#160;hold,&#160;1&#160;to&#160;check)</text>
<text x="20" y="835" fill="#fde68a" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;Arithmetic&#160;check:&#160;$100&#160;/&#160;3&#160;is&#160;about&#160;$33.3333,&#160;which&#160;rounds&#160;to&#160;$33.33,&#160;not&#160;$33.34.</text>
<text x="20" y="854" fill="#c4b5fd" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;under&#160;.lenient:&#160;verified&#160;(3&#160;results&#160;checked,&#160;3&#160;hold)</text>
<text x="20" y="873" fill="#e2e8f0" font-family="Menlo, monospace" font-size="12"></text>
<text x="20" y="892" fill="#7dd3fc" font-family="Menlo, monospace" font-size="12">[5]&#160;LaTeX</text>
<text x="20" y="911" fill="#e2e8f0" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;answer:&#160;&quot;Three&#160;quarters&#160;of&#160;80&#160;is&#160;$\frac{3}{4}&#160;\times&#160;80&#160;=&#160;60$,&#160;and&#160;$12^2&#160;=&#160;124$.&quot;</text>
<text x="20" y="930" fill="#86efac" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;ok&#160;\frac{3}{4}&#160;\times&#160;80&#160;=&#160;60&#160;&#160;-&gt;&#160;&#160;exact</text>
<text x="20" y="949" fill="#f87171" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;XX&#160;12^2&#160;=&#160;124&#160;&#160;-&gt;&#160;&#160;wrong</text>
<text x="20" y="968" fill="#c4b5fd" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;verdict:&#160;wrong&#160;(2&#160;results&#160;checked,&#160;1&#160;hold,&#160;1&#160;wrong)</text>
<text x="20" y="987" fill="#fde68a" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;Arithmetic&#160;check:&#160;12^2&#160;is&#160;144,&#160;not&#160;124.</text>
<text x="20" y="1006" fill="#e2e8f0" font-family="Menlo, monospace" font-size="12"></text>
<text x="20" y="1025" fill="#7dd3fc" font-family="Menlo, monospace" font-size="12">[6]&#160;What&#160;is&#160;left&#160;alone</text>
<text x="20" y="1044" fill="#e2e8f0" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;|&#160;-&#160;Solve&#160;2x&#160;+&#160;3&#160;=&#160;13&#160;for&#160;x.</text>
<text x="20" y="1063" fill="#e2e8f0" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;|&#160;-&#160;The&#160;release&#160;is&#160;on&#160;2026-11-02.</text>
<text x="20" y="1082" fill="#e2e8f0" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;|&#160;-&#160;A&#160;15%&#160;tip&#160;on&#160;$80&#160;is&#160;$14.</text>
<text x="20" y="1101" fill="#e2e8f0" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;|&#160;```python</text>
<text x="20" y="1120" fill="#e2e8f0" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;|&#160;total&#160;=&#160;3&#160;+&#160;4&#160;&#160;#&#160;=&#160;8</text>
<text x="20" y="1139" fill="#e2e8f0" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;|&#160;```</text>
<text x="20" y="1158" fill="#e2e8f0" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;results&#160;read:&#160;0&#160;(algebra,&#160;a&#160;date,&#160;code,&#160;and&#160;&quot;tip&#160;on&quot;&#160;are&#160;not&#160;read&#160;as&#160;arithmetic)</text>
<text x="20" y="1177" fill="#e2e8f0" font-family="Menlo, monospace" font-size="12"></text>
<text x="20" y="1196" fill="#7dd3fc" font-family="Menlo, monospace" font-size="12">[7]&#160;Approximations,&#160;by&#160;policy</text>
<text x="20" y="1215" fill="#e2e8f0" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;answer:&#160;&quot;1000&#160;/&#160;7&#160;is&#160;about&#160;140,&#160;and&#160;100&#160;/&#160;3&#160;is&#160;about&#160;33.3.&quot;</text>
<text x="20" y="1234" fill="#e2e8f0" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;standard:&#160;1000&#160;/&#160;7:&#160;wrong,&#160;100&#160;/&#160;3:&#160;holds&#160;-&gt;&#160;wrong</text>
<text x="20" y="1253" fill="#e2e8f0" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;lenient:&#160;1000&#160;/&#160;7:&#160;holds,&#160;100&#160;/&#160;3:&#160;holds&#160;-&gt;&#160;verified</text>
<text x="20" y="1272" fill="#e2e8f0" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;strict:&#160;1000&#160;/&#160;7:&#160;wrong,&#160;100&#160;/&#160;3:&#160;holds&#160;-&gt;&#160;wrong</text>
<text x="20" y="1291" fill="#e2e8f0" font-family="Menlo, monospace" font-size="12"></text>
<text x="20" y="1310" fill="#7dd3fc" font-family="Menlo, monospace" font-size="12">[8]&#160;A&#160;conversation:&#160;the&#160;same&#160;mistake&#160;twice</text>
<text x="20" y="1329" fill="#e2e8f0" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;turn&#160;1:&#160;&quot;A&#160;20%&#160;discount&#160;takes&#160;20%&#160;of&#160;$45,&#160;which&#160;is&#160;$8,&#160;off&#160;the&#160;price.&quot;</text>
<text x="20" y="1348" fill="#f87171" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;XX&#160;20%&#160;of&#160;$45,&#160;which&#160;is&#160;$8&#160;&#160;-&gt;&#160;&#160;wrong</text>
<text x="20" y="1367" fill="#c4b5fd" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;verdict:&#160;wrong&#160;(1&#160;result&#160;checked,&#160;0&#160;hold,&#160;1&#160;wrong)</text>
<text x="20" y="1386" fill="#e2e8f0" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;turn&#160;2:&#160;&quot;You're&#160;right&#160;to&#160;ask.&#160;The&#160;discount&#160;is&#160;20%&#160;of&#160;$45,&#160;which&#160;is&#160;$8.&quot;</text>
<text x="20" y="1405" fill="#f87171" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;XX&#160;20%&#160;of&#160;$45,&#160;which&#160;is&#160;$8&#160;&#160;-&gt;&#160;&#160;wrong</text>
<text x="20" y="1424" fill="#c4b5fd" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;verdict:&#160;wrong&#160;(1&#160;result&#160;checked,&#160;0&#160;hold,&#160;1&#160;wrong,&#160;1&#160;repeated)</text>
<text x="20" y="1443" fill="#fde68a" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;Arithmetic&#160;check:&#160;20%&#160;of&#160;$45&#160;is&#160;$9,&#160;not&#160;$8.&#160;Some&#160;of&#160;this&#160;was&#160;stated&#160;again&#160;after&#160;a&#160;correction&#160;was&#160;asked&#160;for.</text>
<text x="20" y="1462" fill="#e2e8f0" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;turn&#160;3:&#160;&quot;Correction:&#160;20%&#160;of&#160;$45&#160;is&#160;$9,&#160;so&#160;you&#160;pay&#160;$45&#160;-&#160;$9&#160;=&#160;$36.&quot;</text>
<text x="20" y="1481" fill="#86efac" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;ok&#160;20%&#160;of&#160;$45&#160;is&#160;$9&#160;&#160;-&gt;&#160;&#160;exact</text>
<text x="20" y="1500" fill="#86efac" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;ok&#160;$45&#160;-&#160;$9&#160;=&#160;$36&#160;&#160;-&gt;&#160;&#160;exact</text>
<text x="20" y="1519" fill="#c4b5fd" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;verdict:&#160;verified&#160;(2&#160;results&#160;checked,&#160;2&#160;hold)</text>
<text x="20" y="1538" fill="#c4b5fd" font-family="Menlo, monospace" font-size="12">&#160;&#160;&#160;&#160;ledger:&#160;3&#160;reviews,&#160;4&#160;results,&#160;2&#160;flagged,&#160;1&#160;repeated</text>
</svg>
